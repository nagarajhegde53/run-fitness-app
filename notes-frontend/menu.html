<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RunTrack | Home</title>

    <link rel="stylesheet" href="css/menu.css">
</head>

<body>

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <main class="app">

        <!-- HEADER -->

        <header class="topbar">

            <div class="brand">
                <div class="brand-icon">
                    🏃
                </div>

                <div>
                    <h1>RunTrack</h1>
                    <span>Fitness hub</span>
                </div>
            </div>

            <button class="logout-btn" id="logoutBtn">
                <span>↪</span>
                Logout
            </button>

        </header>


        <!-- WELCOME -->

        <section class="welcome">

            <div class="welcome-text">

                <span class="eyebrow">
                    YOUR FITNESS SPACE
                </span>

                <h2 id="welcomeMessage">
                    Welcome 👋
                </h2>

                <p>
                    Choose a workout and start moving.
                </p>

            </div>

            <div class="welcome-visual">
                <div class="pulse-ring"></div>
                <div class="runner">
                    🏃‍♂️
                </div>
            </div>

        </section>


        <!-- WORKOUTS -->

        <section class="workouts">

            <div class="section-title">
                <span>WORKOUTS</span>
                <h3>What are we doing today?</h3>
            </div>


            <!-- RUNTRACK -->

            <button class="workout-card run-card" id="runTrackBtn">

                <div class="card-top">

                    <div class="workout-icon">
                        🏃
                    </div>

                    <span class="arrow">
                        →
                    </span>

                </div>

                <div class="card-content">

                    <span class="card-label">
                        GPS TRACKING
                    </span>

                    <h4>RunTrack</h4>

                    <p>
                        Track your distance and time
                        using your phone's GPS.
                    </p>

                </div>

                <div class="card-footer">
                    <span>100m → 2km</span>
                    <span>Start run</span>
                </div>

            </button>


            <!-- PUSHUPS -->

            <button class="workout-card pushup-card" id="pushupBtn">

                <div class="card-top">

                    <div class="workout-icon">
                        💪
                    </div>

                    <span class="coming-soon">
                        SOON
                    </span>

                </div>

                <div class="card-content">

                    <span class="card-label">
                        AI FITNESS
                    </span>

                    <h4>Pushups</h4>

                    <p>
                        Let AI detect and count
                        your valid pushup repetitions.
                    </p>

                </div>

                <div class="card-footer">
                    <span>Camera + AI</span>
                    <span>Coming soon</span>
                </div>

            </button>


            <!-- SQUATS -->

            <button class="workout-card squat-card" id="squatBtn">

                <div class="card-top">

                    <div class="workout-icon">
                        🦵
                    </div>

                    <span class="coming-soon">
                        SOON
                    </span>

                </div>

                <div class="card-content">

                    <span class="card-label">
                        AI FITNESS
                    </span>

                    <h4>Bodyweight Squats</h4>

                    <p>
                        AI-powered squat detection
                        and repetition counting.
                    </p>

                </div>

                <div class="card-footer">
                    <span>Camera + AI</span>
                    <span>Coming soon</span>
                </div>

            </button>

        </section>


        <!-- BOTTOM INFO -->

        <section class="info-card">

            <div class="info-icon">
                ⚡
            </div>

            <div>
                <strong>Train smarter</strong>

                <p>
                    More fitness tools are coming to your dashboard.
                </p>
            </div>

        </section>


        <footer>
            <span>RunTrack</span>
            <span>•</span>
            <span>Keep moving.</span>
        </footer>

    </main>

    <script src="js/menu.js"></script>

</body>

</html>
