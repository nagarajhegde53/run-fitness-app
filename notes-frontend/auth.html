<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes | Authentication</title>

    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="background">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
</div>

<div class="auth-container">

    <!-- LEFT -->
    <div class="welcome-panel">

        <h1>Notes App</h1>

        <p>
            Organize your ideas,
            save your thoughts,
            and access them anywhere.
        </p>

    </div>


    <!-- RIGHT -->
    <div class="auth-card">

        <div class="tabs">

            <button id="loginTab" class="tab active">
                Login
            </button>

            <button id="registerTab" class="tab">
                Register
            </button>

        </div>


        <!-- LOGIN -->

        <form id="loginForm">

            <h2>Welcome Back</h2>

            <div class="form-group">

                <label>Username</label>

                <input
                    id="loginUsername"
                    type="text"
                    placeholder="Enter username"
                >

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Enter password"
                >

            </div>

            <button id="loginBtn" class="primary-btn">

                Login

            </button>

        </form>


        <!-- REGISTER -->

        <form id="registerForm" class="hidden">

            <h2>Create Account</h2>

            <div class="form-group">

                <label>Username</label>

                <input
                    id="registerUsername"
                    type="text"
                    placeholder="Choose username"
                >

            </div>

            <div class="form-group">

                <label>Email</label>

                <input
                    id="registerEmail"
                    type="email"
                    placeholder="Enter email"
                >

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    id="registerPassword"
                    type="password"
                    placeholder="Create password"
                >

            </div>

            <div class="form-group">

                <label>Confirm Password</label>

                <input
                    id="confirmPassword"
                    type="password"
                    placeholder="Confirm password"
                >

            </div>

            <button
                id="registerBtn"
                class="primary-btn">

                Register

            </button>

        </form>

    </div>

</div>

<script src="js/auth.js"></script>

</body>
</html>
